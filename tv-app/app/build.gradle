plugins { id 'com.android.application' }

android {
    namespace 'com.ticketgoplus.tv'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ticketgoplus.tv'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.0.' + (System.getenv('VERSION_CODE') ?: '1')
    }
    signingConfigs {
        tv {
            storeFile file('tvkey.jks')
            storePassword 'ticketgotv'
            keyAlias 'tv'
            keyPassword 'ticketgotv'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.tv
        }
        debug { signingConfig signingConfigs.tv }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'com.google.zxing:core:3.5.3'
}
